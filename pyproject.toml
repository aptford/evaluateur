[project]
name = "evaluateur"
version = "0.3.0"
description = "synthetic evals for agents"
readme = "README.md"
authors = [{ name = "Sasha Aptlin", email = "sasha@aptford.com" }]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "anthropic>=0.78.0",
    "instructor>=1.14.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.24",
    "mkdocstrings[python]>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "env: marks tests that require environment credentials (skipped unless --include-env is passed)",
]

[project.urls]
homepage = "https://github.com/aptford/evaluateur"
repository = "https://github.com/aptford/evaluateur"
documentation = "https://evaluateur.aptford.com"
